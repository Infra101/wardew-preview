<style>
/* ==========================================================
   Wardew motion site — palette and tokens (swap colours here)
   ========================================================== */
:root {
  --ink: #0D0909;
  --deep: #1A0F0F;
  --red: #9C3631;
  --ember: #E2554B;
  --spark: #FFB08F;
  --white: #F6EEEA;
  --steel: #A8A0A0;
  --line: rgba(246, 238, 234, .12);
  --line-2: rgba(246, 238, 234, .22);
  --glass: linear-gradient(160deg, rgba(48, 22, 20, .55), rgba(13, 9, 9, .35));

  --display: 'Tenor Sans', 'Optima', 'Candara', sans-serif;
  --body: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;

  --gutter: clamp(16px, 4vw, 64px);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-io: cubic-bezier(.76, 0, .24, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    /* real spring: overshoots and settles, the "bumpy" feel */
    --spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1.004 83.8%, 1);
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ink); color: var(--white); font-family: var(--body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body { background: var(--ink); overflow-x: hidden; min-height: 100vh; font-size: 16px; line-height: 1.6; }
a { color: inherit; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; }
::selection { background: var(--red); color: var(--white); }
:focus-visible { outline: 1px solid var(--spark); outline-offset: 4px; border-radius: 4px; }

html.smooth #scroller { position: fixed; top: 0; left: 0; width: 100%; will-change: transform; }
html.has-cursor, html.has-cursor * { cursor: none !important; }

/* ---------- atmosphere layers ---------- */
#gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; mix-blend-mode: screen; }
.fx { position: fixed; inset: 0; pointer-events: none; }
.fx-beams { z-index: 1; overflow: hidden; mix-blend-mode: screen; }
.fx-beams i { position: absolute; top: -40%; height: 180%; width: 18vw; left: var(--x); background: linear-gradient(90deg, transparent, rgba(226, 85, 75, .07) 40%, rgba(255, 176, 143, .09) 50%, rgba(226, 85, 75, .07) 60%, transparent); transform: rotate(24deg); filter: blur(18px); animation: beam var(--d) ease-in-out infinite alternate; opacity: .6; }
.fx-beams i:nth-child(1) { --x: 8%; --d: 13s; }
.fx-beams i:nth-child(2) { --x: 42%; --d: 17s; width: 10vw; animation-delay: -6s; }
.fx-beams i:nth-child(3) { --x: 74%; --d: 11s; width: 24vw; animation-delay: -3s; }
@keyframes beam { from { transform: translateX(-6vw) rotate(24deg); opacity: .35; } to { transform: translateX(6vw) rotate(28deg); opacity: 1; } }
.fx-vignette { z-index: 1; background: radial-gradient(ellipse 80% 70% at 50% 45%, transparent 35%, rgba(6, 3, 3, .78) 100%); }
.fx-grain { z-index: 90; inset: -60%; opacity: .07; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); animation: grain .9s steps(5) infinite; }
@keyframes grain { 0% { transform: translate(0, 0); } 20% { transform: translate(-4%, 3%); } 40% { transform: translate(3%, -5%); } 60% { transform: translate(-6%, -2%); } 80% { transform: translate(5%, 4%); } 100% { transform: translate(0, 0); } }

#scroller { position: relative; z-index: 2; }
#view { position: relative; }

/* ---------- loader ---------- */
#loader { position: fixed; inset: 0; z-index: 200; background: var(--ink); display: grid; place-items: center; }
.ld-inner { width: min(440px, 76vw); }
.ld-logo { width: 100%; border-radius: 6px; clip-path: inset(0 100% 0 0); animation: ldReveal 1.2s var(--ease-io) .15s forwards; box-shadow: 0 30px 80px -20px rgba(156, 54, 49, .7); }
@keyframes ldReveal { to { clip-path: inset(-300% -150% -300% -150%); } }
/* charge-up: glow, electric edge, scan line; .critical = overload buzz before the explosion */
@property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
.ld-logo-wrap { --p: 0; position: relative; border-radius: 6px; will-change: transform; }
.ld-logo-wrap .ld-logo { box-shadow: 0 0 calc(20px + var(--p) * 90px) calc(var(--p) * 18px) rgba(226, 85, 75, calc(.25 + var(--p) * .6)), 0 30px 80px -20px rgba(156, 54, 49, .7); filter: brightness(calc(1 + var(--p) * .12)); }
.ld-edge { position: absolute; inset: -3px; border-radius: 9px; padding: 2px; background: conic-gradient(from var(--ang), transparent 0 62%, var(--ember) 78%, #fff3ea 86%, transparent 94%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: ldEdge calc(1.6s - var(--p) * 1s) linear infinite; opacity: calc(.3 + var(--p)); pointer-events: none; }
@keyframes ldEdge { to { --ang: 360deg; } }
.ld-scan { position: absolute; left: 0; right: 0; top: 0; height: 22%; border-radius: 6px; background: linear-gradient(transparent, rgba(255, 220, 200, .35), transparent); mix-blend-mode: screen; animation: ldScan 1.4s cubic-bezier(.6, 0, .4, 1) infinite; pointer-events: none; }
@keyframes ldScan { from { transform: translateY(-30%); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(480%); opacity: 0; } }
.ld-spark { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff1e6; box-shadow: 0 0 8px 2px var(--ember), 0 0 16px 4px rgba(226, 85, 75, .5); pointer-events: none; }
#loader.critical .ld-logo-wrap { animation: ldBuzz .06s linear infinite; }
#loader.critical .ld-logo { filter: brightness(1.3); box-shadow: 0 0 60px 14px rgba(226, 85, 75, .95), 0 0 160px 50px rgba(156, 54, 49, .75); transition: filter .3s, box-shadow .3s; }
@keyframes ldBuzz { 0% { transform: translate(3px, -2px) rotate(.4deg) scale(1.02); } 25% { transform: translate(-4px, 2px) rotate(-.5deg) scale(1.03); } 50% { transform: translate(2px, 3px) rotate(.3deg) scale(1.04); } 75% { transform: translate(-3px, -3px) rotate(-.3deg) scale(1.03); } 100% { transform: translate(3px, -2px) rotate(.4deg) scale(1.02); } }
.ld-shard { position: absolute; background-repeat: no-repeat; will-change: transform, opacity; backface-visibility: visible; }
.ld-wave { position: absolute; width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--spark); box-shadow: 0 0 40px var(--ember), inset 0 0 40px var(--ember); pointer-events: none; }
.ld-flash { position: absolute; inset: 0; opacity: 0; pointer-events: none; background: radial-gradient(circle at var(--cx, 50%) var(--cy, 50%), #fff6ee 0%, rgba(255, 176, 143, .85) 18%, rgba(226, 85, 75, .35) 45%, transparent 75%); z-index: 2; }
#loader { perspective: 900px; overflow: hidden; }
.ld-meta, .ld-bar { transition: opacity .3s; }
.ld-meta { display: flex; justify-content: space-between; margin-top: 22px; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--steel); }
.ld-count { color: var(--white); font-variant-numeric: tabular-nums; }
.ld-bar { height: 1px; background: var(--line); margin-top: 12px; overflow: hidden; }
.ld-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--ember), var(--spark)); transform-origin: left; transform: scaleX(var(--p, 0)); }

/* ---------- page shutter ---------- */
#shutter { position: fixed; inset: 0; z-index: 150; pointer-events: none; visibility: hidden; }
#shutter.on { visibility: visible; pointer-events: all; }
.sh-cols { position: absolute; inset: 0; display: flex; }
.sh-cols .col { flex: 1; height: 100%; background: var(--red); transform: scaleY(0); position: relative; margin-right: -1px; }
.sh-cols .col b { position: absolute; inset: 0; background: var(--ink); transform: scaleY(0); }
.sh-title { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px; opacity: 0; }
.sh-title .sh-k { font-family: var(--mono); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--spark); }
.sh-title .sh-n { font-family: var(--display); font-size: clamp(2.6rem, 8vw, 7rem); line-height: 1; }

/* ---------- cursor ---------- */
#cursor { position: fixed; inset: 0; pointer-events: none; z-index: 300; display: none; }
html.has-cursor #cursor { display: block; }
.c-dot, .c-ring { position: fixed; left: 0; top: 0; border-radius: 50%; will-change: transform; }
.c-dot { width: 6px; height: 6px; margin: -3px 0 0 -3px; background: var(--spark); box-shadow: 0 0 12px var(--ember); }
.c-ring { width: 42px; height: 42px; margin: -21px 0 0 -21px; border: 1px solid rgba(255, 176, 143, .55); display: grid; place-items: center; transition: width .55s var(--spring), height .55s var(--spring), margin .55s var(--spring), background .3s, border-color .3s; }
.c-ring span { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--white); opacity: 0; transform: scale(.6); transition: opacity .25s, transform .5s var(--spring); white-space: nowrap; }
.c-ring.hover { width: 70px; height: 70px; margin: -35px 0 0 -35px; background: rgba(156, 54, 49, .22); border-color: var(--ember); }
.c-ring.label { width: 92px; height: 92px; margin: -46px 0 0 -46px; background: var(--red); border-color: var(--red); }
.c-ring.label span { opacity: 1; transform: none; }
.c-ring.text { width: 4px; height: 34px; margin: -17px 0 0 -2px; border-radius: 2px; background: var(--spark); border-color: transparent; }
.c-ring.down { width: 30px; height: 30px; margin: -15px 0 0 -15px; }
.ripple { position: fixed; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 1px solid var(--ember); pointer-events: none; z-index: 299; animation: ripple .9s var(--ease-out) forwards; }
@keyframes ripple { to { transform: scale(13); opacity: 0; border-width: .3px; } }

/* ---------- nav ---------- */
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 60; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 18px var(--gutter); transition: transform .8s var(--spring); }
.nav::before { content: ""; position: absolute; inset: 0 0 -30px; background: linear-gradient(rgba(13, 9, 9, .85), rgba(13, 9, 9, 0)); opacity: 0; transition: opacity .5s; z-index: -1; pointer-events: none; }
.nav.solid::before { opacity: 1; }
.nav.hide { transform: translateY(-120%); }
.brand { display: block; border-radius: 6px; transition: transform .7s var(--spring); }
.brand:hover { transform: scale(1.06) rotate(-2deg); }
.brand img { height: 44px; width: auto; border-radius: 5px; box-shadow: 0 10px 30px -10px rgba(156, 54, 49, .8); }
.links { position: relative; isolation: isolate; display: flex; gap: 2px; list-style: none; padding: 5px; border: 1px solid var(--line); border-radius: 999px; background: rgba(13, 9, 9, .5); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.links a { position: relative; display: block; padding: 10px 16px; border-radius: 999px; font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--steel); text-decoration: none; transition: color .35s; }
.links a:hover, .links a.active { color: var(--white); }
.links .pill { position: absolute; top: 5px; bottom: 5px; left: 0; width: 0; border-radius: 999px; background: var(--red); z-index: -1; transition: left .8s var(--spring), width .8s var(--spring); box-shadow: 0 0 24px -4px rgba(226, 85, 75, .7); }
.roll { display: inline-flex; flex-direction: column; height: 1.25em; line-height: 1.25em; overflow: hidden; vertical-align: top; }
.roll > span { display: block; transition: transform .6s var(--spring); }
a:hover > .roll > span, button:hover > .roll > span { transform: translateY(-100%); }
.burger { display: none; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line-2); position: relative; background: rgba(13, 9, 9, .5); backdrop-filter: blur(12px); }
.burger i { position: absolute; left: 14px; right: 14px; height: 1.5px; background: var(--white); transition: transform .6s var(--spring), top .6s var(--spring); }
.burger i:nth-child(1) { top: 19px; }
.burger i:nth-child(2) { top: 28px; }
html.menu-open .burger i:nth-child(1) { top: 23.5px; transform: rotate(45deg); }
html.menu-open .burger i:nth-child(2) { top: 23.5px; transform: rotate(-45deg); }

.menu { position: fixed; inset: 0; z-index: 55; background: var(--ink); clip-path: circle(0% at calc(100% - 40px) 40px); transition: clip-path .9s var(--ease-io); display: grid; align-content: center; padding: 100px var(--gutter) 40px; }
html.menu-open .menu { clip-path: circle(150% at calc(100% - 40px) 40px); }
.menu ul { list-style: none; }
.menu li { overflow: hidden; }
.menu a { display: flex; align-items: baseline; gap: 16px; font-family: var(--display); font-size: clamp(2.4rem, 11vw, 4.6rem); line-height: 1.15; text-decoration: none; transform: translateY(110%); transition: transform .9s var(--spring) calc(.25s + var(--i) * 60ms), color .3s; }
.menu a small { font-family: var(--mono); font-size: 12px; color: var(--ember); letter-spacing: .1em; }
.menu a.active { color: var(--spark); }
html.menu-open .menu a { transform: none; }
.menu-foot { margin-top: 40px; font-family: var(--mono); font-size: 12px; color: var(--steel); letter-spacing: .08em; display: grid; gap: 6px; }
.menu .menu-foot a { display: block; font-family: var(--mono); font-size: 13px; line-height: 1.6; text-decoration: none; transform: none; color: var(--steel); }

/* ---------- HUD ---------- */
.hud { position: fixed; left: calc(var(--gutter) - 14px); bottom: 20px; z-index: 40; display: flex; align-items: center; gap: 14px; padding: 9px 16px; border-radius: 999px; background: rgba(13, 9, 9, .62); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--steel); pointer-events: none; }
.hud .h-idx { display: inline-block; color: var(--white); font-size: 13px; min-width: 2ch; }
.hud .h-line { width: 36px; height: 1px; background: var(--line-2); }
.hud .h-lbl { display: inline-block; }
.hud .swap { animation: hudIn .7s var(--spring); }
@keyframes hudIn { from { transform: translateY(100%); opacity: 0; filter: blur(4px); } }
.progress { position: fixed; right: 22px; top: 50%; height: 34vh; width: 1px; transform: translateY(-50%); background: var(--line); z-index: 40; pointer-events: none; }
.progress i { position: absolute; inset: 0; background: linear-gradient(var(--spark), var(--ember), var(--red)); transform-origin: top; transform: scaleY(var(--p, 0)); box-shadow: 0 0 10px var(--ember); }
.progress b { position: absolute; left: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); border: 1px solid var(--line-2); transition: background .4s, border-color .4s, transform .6s var(--spring); }
.progress b.on { background: var(--ember); border-color: var(--ember); transform: scale(1.4); }

/* ---------- sections and type ---------- */
.sec { position: relative; min-height: 100vh; min-height: 100svh; padding: clamp(120px, 17vh, 190px) var(--gutter) clamp(90px, 13vh, 150px); display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 24px; align-content: center; }
.copy { grid-column: 1 / span 6; position: relative; }
.sec[data-side="left"] .copy { grid-column: 7 / span 6; }
.sec[data-side="center"] > .copy { grid-column: 2 / span 10; text-align: center; display: flex; flex-direction: column; align-items: center; }
.sec[data-side="center"] .lead { margin-inline: auto; }
.full { grid-column: 1 / -1; }

.kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--spark); display: inline-flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.kicker::before { content: ""; width: 30px; height: 1px; background: var(--ember); transform-origin: left; transform: scaleX(0); transition: transform 1s var(--ease-out) .15s; box-shadow: 0 0 8px var(--ember); }
.kicker.in::before { transform: scaleX(1); }
.display { font-family: var(--display); font-weight: 400; font-size: clamp(2.8rem, 8vw, 8.2rem); line-height: .98; letter-spacing: -.01em; }
.h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2.2rem, 4.8vw, 4.6rem); line-height: 1.04; letter-spacing: -.005em; }
.h3 { font-family: var(--display); font-weight: 400; font-size: clamp(1.4rem, 2vw, 1.9rem); line-height: 1.15; }
.display em, .h2 em, .h3 em { font-style: normal; }
em .wi, .grad { background: linear-gradient(100deg, var(--spark) 0%, var(--ember) 45%, #c2443d 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lead { font-size: clamp(1.04rem, 1.25vw, 1.22rem); line-height: 1.7; color: rgba(246, 238, 234, .84); max-width: 56ch; margin-top: 28px; }
.body { color: var(--steel); max-width: 56ch; margin-top: 18px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--steel); }
.actions { margin-top: 40px; display: flex; gap: 14px; flex-wrap: wrap; }
.sec[data-side="center"] .actions { justify-content: center; }
.copy, .full { text-shadow: 0 2px 30px rgba(13, 9, 9, .6); }

/* split-word reveal */
.w { display: inline-block; overflow: hidden; vertical-align: top; padding: .1em .03em .14em; margin: -.1em -.03em -.14em; }
.wi { display: inline-block; transform: translate3d(0, 118%, 0) rotate(7deg); transform-origin: 0 100%; transition: transform 1.3s var(--spring) calc(var(--i) * 55ms + var(--d, 0ms)); }
.in .wi { transform: none; }

[data-reveal] { opacity: 0; transform: translate3d(0, 46px, 0); filter: blur(10px); transition: opacity 1s var(--ease-out) var(--d, 0ms), transform 1.3s var(--spring) var(--d, 0ms), filter 1s var(--ease-out) var(--d, 0ms); }
[data-reveal].in { opacity: 1; transform: none; filter: blur(0); }
[data-stagger] > * { opacity: 0; transform: translate3d(0, 34px, 0) scale(.92); transition: opacity .8s var(--ease-out) calc(var(--i) * 70ms), transform 1.1s var(--spring) calc(var(--i) * 70ms); }
[data-stagger].in > * { opacity: 1; transform: none; }

/* ---------- buttons ---------- */
.btn { --h: 56px; position: relative; display: inline-flex; align-items: center; gap: 14px; height: var(--h); padding: 0 28px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--white); text-decoration: none; font-family: var(--mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; overflow: hidden; isolation: isolate; white-space: nowrap; transition: border-color .4s, transform .9s var(--spring), box-shadow .5s; background: rgba(13, 9, 9, .35); backdrop-filter: blur(10px); }
.btn::before { content: ""; position: absolute; left: var(--x, 50%); top: var(--y, 50%); width: 0; height: 0; border-radius: 50%; background: var(--red); transform: translate(-50%, -50%); transition: width .75s var(--spring), height .75s var(--spring); z-index: -1; }
.btn:hover::before { width: 260%; height: 520%; }
.btn:hover { border-color: var(--ember); box-shadow: 0 10px 40px -10px rgba(226, 85, 75, .8); }
.btn.solid { background: var(--red); border-color: var(--red); }
.btn.solid::before { background: var(--ember); }
.arr { display: inline-block; width: 18px; height: 18px; background: currentColor; -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 12h15M13 5l7 7-7 7' fill='none' stroke='black' stroke-width='1.7'/></svg>") center / contain no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M4 12h15M13 5l7 7-7 7' fill='none' stroke='black' stroke-width='1.7'/></svg>") center / contain no-repeat; transition: transform .7s var(--spring); flex: none; }
.btn:hover .arr, .row:hover .arr, .card:hover .arr { transform: translateX(4px) rotate(-45deg); }
.nav-cta { --h: 46px; padding: 0 20px; font-size: 11px; }

/* ---------- glass cards (glassmorphism) ---------- */
.card { position: relative; padding: clamp(26px, 3vw, 40px); border: 1px solid var(--line); border-radius: 24px; background: var(--glass); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); transform: perspective(1000px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(0); transition: transform 1s var(--spring), border-color .4s, box-shadow .6s; overflow: hidden; isolation: isolate; text-decoration: none; display: block; }
.card.tilting { transition: transform .12s linear, border-color .4s, box-shadow .6s; }
.card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 176, 143, .17), transparent 45%); opacity: 0; transition: opacity .4s; z-index: -1; pointer-events: none; }
.card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: radial-gradient(300px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 176, 143, .8), transparent 40%); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .4s; pointer-events: none; }
.card:hover { box-shadow: 0 30px 80px -30px rgba(156, 54, 49, .6); }
.card:hover::after, .card:hover::before { opacity: 1; }
.card .mono { margin-bottom: 18px; display: block; }
.card p { color: var(--steel); margin-top: 12px; }
.card .h3 + p { margin-top: 14px; }
.card .more { display: inline-flex; gap: 10px; align-items: center; margin-top: 26px; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--spark); }

.grid { display: grid; gap: 18px; margin-top: 56px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.sec[data-side="center"] .chips { justify-content: center; }
.chip { padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--mono); font-size: 12px; letter-spacing: .06em; background: rgba(26, 15, 15, .55); backdrop-filter: blur(8px); transition: transform .7s var(--spring), background .3s, border-color .3s, box-shadow .4s; }
.chip:hover { transform: translateY(-5px) scale(1.07) rotate(-1.5deg); background: var(--red); border-color: var(--red); box-shadow: 0 12px 30px -10px rgba(226, 85, 75, .9); }

/* ---------- service rows ---------- */
.rows { list-style: none; border-top: 1px solid var(--line); margin-top: 48px; }
.row { position: relative; display: grid; grid-template-columns: 60px 1fr auto; align-items: center; gap: 16px; padding: 20px 14px; border-bottom: 1px solid var(--line); overflow: hidden; isolation: isolate; }
.row::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--red), rgba(156, 54, 49, .35)); transform: scaleY(0); transform-origin: bottom; transition: transform .7s var(--spring); z-index: -1; }
.row:hover::before { transform: scaleY(1); }
.row .n { font-family: var(--mono); font-size: 12px; color: var(--steel); transition: color .3s; }
.row:hover .n { color: var(--spark); }
.row .t { font-family: var(--display); font-size: clamp(1.15rem, 1.9vw, 1.7rem); line-height: 1.2; transition: transform .8s var(--spring); }
.row:hover .t { transform: translateX(14px); }
.row .arr { opacity: .4; transition: transform .7s var(--spring), opacity .3s; }
.row:hover .arr { opacity: 1; }
.rows.two { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; border-top: 0; }
.rows.two .row:nth-child(-n+2) { border-top: 1px solid var(--line); }

/* ---------- marquee (kinetic type) ---------- */
.marquee { grid-column: 1 / -1; margin-inline: calc(var(--gutter) * -1); overflow: hidden; padding: 26px 0; border-block: 1px solid var(--line); -webkit-mask: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.mq-track { display: flex; width: max-content; will-change: transform; }
.mq-item { font-family: var(--display); font-size: clamp(2rem, 5vw, 4.4rem); padding: 0 .55em; white-space: nowrap; display: flex; align-items: center; gap: 1.1em; line-height: 1.1; transition: color .3s; }
.mq-item::after { content: "\2726"; font-size: .38em; color: var(--ember); text-shadow: 0 0 14px var(--ember); }
.mq-outline .mq-item { color: transparent; -webkit-text-stroke: 1px rgba(246, 238, 234, .45); }
.mq-outline .mq-item:hover { color: var(--white); }

.kinetic { grid-column: 1 / -1; margin-inline: calc(var(--gutter) * -1); display: grid; gap: 0; overflow: hidden; }
.kin-line { white-space: nowrap; font-family: var(--display); font-size: clamp(3.5rem, 13vw, 13rem); line-height: .98; will-change: transform; display: flex; gap: .3em; }
.kin-line span { display: inline-block; transition: color .4s, -webkit-text-stroke-color .4s; }
.kin-line .o { color: transparent; -webkit-text-stroke: 1.2px rgba(246, 238, 234, .5); }
.kin-line .f { color: var(--white); }
.kin-line .r { background: linear-gradient(100deg, var(--spark), var(--ember) 50%, var(--red)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kin-line span:hover { -webkit-text-stroke-color: var(--spark); }

/* ---------- split-flap board ---------- */
.board { grid-column: 1 / -1; margin-top: 56px; padding: clamp(18px, 2.4vw, 32px); border-radius: 22px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(20, 12, 12, .92), rgba(10, 7, 7, .92)); box-shadow: 0 40px 100px -40px rgba(0, 0, 0, .9), inset 0 1px 0 rgba(255, 255, 255, .05); max-width: 1100px; width: 100%; justify-self: center; }
.board-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--mono); font-size: 11px; letter-spacing: .3em; color: var(--spark); margin-bottom: 18px; text-transform: uppercase; }
.board-head .live { display: inline-flex; align-items: center; gap: 8px; color: var(--steel); }
.board-head .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #6BE38B; box-shadow: 0 0 10px #6BE38B; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.b-row { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.3fr); gap: clamp(10px, 2vw, 28px); align-items: center; padding: 10px 0; border-top: 1px dashed rgba(246, 238, 234, .08); }
.b-cap { font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--steel); text-transform: uppercase; margin-top: 8px; }
.flap { display: flex; gap: 3px; flex-wrap: nowrap; }
.flap .cell { position: relative; width: clamp(18px, 2.3vw, 34px); height: clamp(28px, 3.4vw, 48px); border-radius: 4px; background: linear-gradient(180deg, #241717 0 49.4%, #1b1111 50.6% 100%); display: grid; place-items: center; font-family: var(--mono); font-weight: 500; font-size: clamp(14px, 1.9vw, 26px); color: var(--white); box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .5), 0 2px 4px rgba(0, 0, 0, .5); perspective: 200px; overflow: hidden; }
.flap .cell::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0, 0, 0, .75); }
.flap .cell span { display: block; transform-origin: 50% 50%; }
.flap.hot .cell { color: var(--spark); text-shadow: 0 0 10px rgba(226, 85, 75, .7); }

/* ---------- testimonials ---------- */
.quote { display: flex; flex-direction: column; text-align: left; }
.quote .mark { font-family: var(--display); font-size: 5.5rem; line-height: .6; color: var(--ember); height: .45em; text-shadow: 0 0 30px rgba(226, 85, 75, .6); }
.quote blockquote { font-family: var(--display); font-size: clamp(1.35rem, 2.2vw, 2rem); line-height: 1.3; margin-top: 18px; }
.quote .ctx { font-family: var(--mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--spark); margin-top: 24px; }
.quote .who { margin-top: auto; padding-top: 28px; display: flex; align-items: center; gap: 14px; }
.quote .who b { font-weight: 500; display: block; }
.quote .who small { color: var(--steel); font-size: 13px; }

/* ---------- liquid-morph monogram avatars ---------- */
.person { text-align: left; }
.blob { width: 74px; height: 74px; display: grid; place-items: center; font-family: var(--display); font-size: 1.4rem; color: var(--white); background: radial-gradient(circle at 30% 25%, var(--spark), var(--ember) 40%, var(--red) 75%); border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; animation: morph 9s ease-in-out infinite; box-shadow: 0 14px 40px -12px rgba(226, 85, 75, .8), inset 0 -8px 20px rgba(0, 0, 0, .25); margin-bottom: 22px; transition: transform .8s var(--spring); }
.person:hover .blob { transform: scale(1.12) rotate(-8deg); }
@keyframes morph {
  0%, 100% { border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; }
  25% { border-radius: 70% 30% 46% 54% / 30% 39% 61% 70%; }
  50% { border-radius: 30% 70% 70% 30% / 53% 30% 70% 47%; }
  75% { border-radius: 56% 44% 32% 68% / 61% 55% 45% 39%; }
}
.person .role { font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--spark); margin-top: 8px; }

/* ---------- stats ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; margin-top: 60px; width: 100%; }
.stat { text-align: left; }
.stat .num { font-family: var(--display); font-size: clamp(2.6rem, 5vw, 5rem); line-height: 1; font-variant-numeric: tabular-nums; }
.stat .lbl { font-family: var(--mono); font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--steel); margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

/* ---------- timeline ---------- */
.timeline { position: relative; margin-top: 56px; padding-left: 44px; text-align: left; }
.timeline::before, .timeline .tl-fill { content: ""; position: absolute; left: 8px; top: 6px; bottom: 0; width: 1px; background: var(--line); }
.timeline .tl-fill { background: linear-gradient(var(--spark), var(--ember), var(--red)); transform-origin: top; transform: scaleY(var(--p, 0)); box-shadow: 0 0 10px var(--ember); }
.tl-item { position: relative; padding-bottom: 46px; }
.tl-item::before { content: ""; position: absolute; left: -42px; top: .7em; width: 13px; height: 13px; border-radius: 50%; border: 1px solid var(--ember); background: var(--ink); transition: background .5s, box-shadow .5s, transform .8s var(--spring); }
.tl-item.in::before { background: var(--ember); box-shadow: 0 0 18px var(--ember); transform: scale(1.25); }
.tl-year { font-family: var(--display); font-size: clamp(2rem, 4vw, 3.4rem); line-height: 1.1; }
.tl-item p { color: var(--steel); max-width: 50ch; margin-top: 6px; }

/* ---------- blueprint ---------- */
.blueprint { grid-column: 1 / -1; position: relative; margin-top: 56px; border-radius: 20px; overflow: hidden; border: 1px solid rgba(226, 85, 75, .35); background-color: #140b0b; background-image: linear-gradient(rgba(226, 85, 75, .14) 1px, transparent 1px), linear-gradient(90deg, rgba(226, 85, 75, .14) 1px, transparent 1px), linear-gradient(rgba(226, 85, 75, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(226, 85, 75, .06) 1px, transparent 1px); background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px; box-shadow: inset 0 0 120px rgba(0, 0, 0, .7); }
.blueprint svg { display: block; width: 100%; height: auto; }
.bp-stroke { fill: none; stroke: var(--white); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.bp-thin { fill: none; stroke: rgba(255, 176, 143, .7); stroke-width: .8; stroke-dasharray: 6 5; }
.bp-dim { fill: none; stroke: var(--spark); stroke-width: .8; }
.bp-text { font-family: var(--mono); font-size: 11px; fill: var(--spark); letter-spacing: .12em; }
.bp-big { font-family: var(--display); font-size: 22px; fill: var(--white); letter-spacing: .05em; }
.draw { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); transition: stroke-dashoffset 2.6s var(--ease-io) var(--d, 0ms); }
.blueprint.in .draw { stroke-dashoffset: 0; }
.bp-fade { opacity: 0; transition: opacity 1s var(--ease-out) var(--d, 1800ms); }
.blueprint.in .bp-fade { opacity: 1; }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
.spin.rev { animation-duration: 9.33s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- isometric smart building ---------- */
.iso-wrap { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 40px; align-items: center; margin-top: 40px; }
.iso-stage { height: clamp(360px, 46vw, 560px); display: grid; place-items: center; perspective: 2000px; }
.iso { position: relative; width: 340px; height: 255px; transform: rotateX(58deg) rotateZ(-45deg); transform-style: preserve-3d; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.iso::before { content: ""; position: absolute; inset: -30px; border: 1px solid rgba(226, 85, 75, .35); background-image: linear-gradient(rgba(226, 85, 75, .12) 1px, transparent 1px), linear-gradient(90deg, rgba(226, 85, 75, .12) 1px, transparent 1px); background-size: 21px 21px; transform: translateZ(-1px); }
.blk { --hgt: 40px; position: relative; transform-style: preserve-3d; transform: translateZ(0); transition: transform 1.1s var(--spring) calc(var(--i) * 60ms); }
.iso-wrap.in .blk { transform: translateZ(var(--hgt)); }
.blk.hl { transform: translateZ(calc(var(--hgt) + 40px)) !important; transition-delay: 0s; transition-duration: .7s; }
.blk i { position: absolute; inset: 0; background: #2a1817; border: 1px solid rgba(255, 176, 143, .25); transition: background .4s, box-shadow .4s; }
.blk i.top { background: linear-gradient(135deg, #3a2120, #241515); }
.blk i.s1 { transform-origin: bottom; top: auto; height: var(--hgt); bottom: 0; transform: rotateX(90deg); background: #1c1010; }
.blk i.s2 { transform-origin: right; left: auto; width: var(--hgt); right: 0; transform: rotateY(-90deg); background: #150c0c; }
.blk.lit i.top { background: radial-gradient(circle, var(--spark), var(--ember) 55%, var(--red)); box-shadow: 0 0 40px var(--ember); }
.blk.lit i.s1 { background: #7a2a26; }
.blk.lit i.s2 { background: #5c1f1c; }
.iso-list { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; }
.iso-list li { display: flex; gap: 12px; align-items: baseline; padding: 11px 6px; border-bottom: 1px solid var(--line); font-size: 15px; transition: color .3s, transform .6s var(--spring), background .3s; border-radius: 6px; }
.iso-list li span { font-family: var(--mono); font-size: 11px; color: var(--steel); }
.iso-list li.hl { color: var(--spark); transform: translateX(8px); background: rgba(156, 54, 49, .25); }

/* ---------- ASCII field ---------- */
.ascii-wrap { grid-column: 1 / -1; position: relative; margin-top: 50px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: rgba(10, 6, 6, .85); min-height: 420px; display: grid; align-content: center; }
.ascii-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ascii-wrap .chips { position: relative; z-index: 1; justify-content: center; padding: 50px clamp(16px, 4vw, 60px); margin: 0; }
.ascii-wrap .chip { background: rgba(13, 9, 9, .82); }

/* ---------- neon ---------- */
.neon { color: #ffd9c9; text-shadow: 0 0 4px #fff, 0 0 12px var(--spark), 0 0 28px var(--ember), 0 0 60px var(--red), 0 0 100px var(--red); opacity: .15; }
.in .neon, .neon.in { animation: neonOn 1.6s steps(1) .9s forwards, neonHum 4s ease-in-out 2.6s infinite; }
@keyframes neonOn { 0% { opacity: .15; } 8% { opacity: 1; } 12% { opacity: .2; } 20% { opacity: 1; } 24% { opacity: .3; } 40% { opacity: 1; } 44% { opacity: .5; } 50%, 100% { opacity: 1; } }
@keyframes neonHum { 0%, 100% { opacity: 1; } 47% { opacity: 1; } 48% { opacity: .75; } 49% { opacity: 1; } }

/* ---------- wireframe floor ---------- */
.floor { position: absolute; left: -20%; right: -20%; bottom: 0; height: 42vh; perspective: 340px; overflow: hidden; pointer-events: none; z-index: -1; -webkit-mask: linear-gradient(transparent, #000 60%); mask: linear-gradient(transparent, #000 60%); }
.floor::before { content: ""; position: absolute; inset: -100% 0 0; background-image: linear-gradient(rgba(226, 85, 75, .55) 1px, transparent 1px), linear-gradient(90deg, rgba(226, 85, 75, .55) 1px, transparent 1px); background-size: 70px 70px; transform: rotateX(72deg); transform-origin: bottom; animation: floor 3s linear infinite; }
@keyframes floor { to { background-position: 0 70px, 0 0; } }

/* ---------- hero ---------- */
.hero { align-content: end; padding-bottom: clamp(56px, 10vh, 120px); }
.hero-flank { position: absolute; left: var(--gutter); right: var(--gutter); top: 40%; display: flex; justify-content: space-between; pointer-events: none; }
.hero-flank span { font-family: var(--display); font-size: clamp(12px, 1.1vw, 15px); letter-spacing: .7em; text-transform: uppercase; color: rgba(246, 238, 234, .75); transition: letter-spacing 2s var(--ease-out) .6s, opacity 1.6s var(--ease-out) .6s, filter 1.6s var(--ease-out) .6s; opacity: 0; filter: blur(8px); }
.hero-flank span.r { text-align: right; }
.hero.in-hero .hero-flank span { opacity: 1; filter: none; letter-spacing: .5em; }
.hero-bottom { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 40px; align-items: end; }
.hero .display { font-size: clamp(2.6rem, 5.9vw, 6.2rem); }
.hb-right .lead { margin: 0 0 28px; }
.page-hero .display { font-size: clamp(2.8rem, 7vw, 7rem); }
.scroll-cue { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: grid; justify-items: center; gap: 10px; font-family: var(--mono); font-size: 10px; letter-spacing: .3em; text-transform: uppercase; color: var(--steel); }
.scroll-cue i { width: 1px; height: 46px; background: var(--line-2); position: relative; overflow: hidden; }
.scroll-cue i::after { content: ""; position: absolute; left: 0; top: -40%; width: 1px; height: 40%; background: var(--spark); animation: cue 1.8s var(--ease-io) infinite; }
@keyframes cue { to { top: 100%; } }
.big-index { position: absolute; top: -.55em; right: 0; font-family: var(--display); font-size: clamp(6rem, 13vw, 12rem); line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(226, 85, 75, .35); z-index: -1; pointer-events: none; }

/* ---------- forms ---------- */
.form { margin-top: 44px; display: grid; gap: 8px; text-align: left; }
.field { position: relative; padding-top: 14px; }
.field input, .field textarea { width: 100%; background: transparent; border: 0; border-bottom: 1px solid rgba(246, 238, 234, .25); padding: 16px 0 12px; color: var(--white); font: inherit; font-size: 1.06rem; outline: none; border-radius: 0; resize: none; }
.field textarea { min-height: 110px; }
.field label { position: absolute; left: 0; top: 30px; color: var(--steel); pointer-events: none; transform-origin: left; transition: transform .6s var(--spring), color .3s; }
.field input:focus + label, .field input:not(:placeholder-shown) + label, .field textarea:focus + label, .field textarea:not(:placeholder-shown) + label { transform: translateY(-26px) scale(.78); color: var(--spark); }
.field .bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: linear-gradient(90deg, var(--red), var(--ember), var(--spark)); transform: scaleX(0); transform-origin: left; transition: transform .8s var(--spring); box-shadow: 0 0 12px var(--ember); }
.field input:focus ~ .bar, .field textarea:focus ~ .bar { transform: scaleX(1); }
.field.bad .bar { transform: scaleX(1); background: #ff6b5b; }
.field.bad { animation: shake .5s var(--spring); }
@keyframes shake { 20% { transform: translateX(-10px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.choice { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 10px; border: 0; }
.choice legend { font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--steel); margin-bottom: 12px; width: 100%; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice label { padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 14px; transition: background .3s, border-color .3s, transform .6s var(--spring); }
.choice input:checked + label { background: var(--red); border-color: var(--ember); transform: scale(1.05); box-shadow: 0 8px 30px -10px rgba(226, 85, 75, .9); }
.choice input:focus-visible + label { outline: 1px solid var(--spark); outline-offset: 3px; }
.form-ok { display: none; margin-top: 40px; text-align: left; }
.form-ok.show { display: block; animation: okIn 1s var(--spring); }
@keyframes okIn { from { opacity: 0; transform: translateY(30px) scale(.95); } }
.note { font-family: var(--mono); font-size: 11px; color: var(--steel); letter-spacing: .06em; margin-top: 14px; }

.contact-line { display: grid; gap: 4px; margin-top: 18px; }
.contact-line a { text-decoration: none; position: relative; width: fit-content; }
.u { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .6s var(--ease-out); }
.u:hover { background-size: 100% 1px; }

/* ---------- footer ---------- */
.foot { min-height: auto; align-content: end; padding-top: 22vh; overflow: hidden; }
.foot-cta { grid-column: 1 / -1; text-align: center; display: flex; flex-direction: column; align-items: center; }
.mail-big { font-family: var(--display); font-size: clamp(1.6rem, 4.6vw, 4.2rem); text-decoration: none; margin-top: 30px; position: relative; transition: color .3s; }
.mail-big::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 2px; background: linear-gradient(90deg, var(--red), var(--ember), var(--spark)); transform: scaleX(.12); transition: transform .9s var(--spring); }
.mail-big:hover { color: var(--spark); }
.mail-big:hover::after { transform: scaleX(1); }
.foot-grid { grid-column: 1 / -1; display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 30px; margin-top: 14vh; padding-top: 40px; border-top: 1px solid var(--line); }
.foot-grid h4 { font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--spark); margin-bottom: 16px; }
.foot-grid ul { list-style: none; display: grid; gap: 8px; color: var(--steel); font-size: 14.5px; }
.foot-grid a { text-decoration: none; transition: color .3s; }
.foot-grid a:hover { color: var(--white); }
.foot-brand img { width: 190px; border-radius: 6px; }
.foot-brand p { color: var(--steel); font-size: 14px; margin-top: 18px; max-width: 30ch; }
.foot-base { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 48px; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--steel); }

.foot-giant { grid-column: 1 / -1; font-family: var(--display); font-size: 22vw; line-height: .78; text-align: center; margin: 6vh calc(var(--gutter) * -1) calc(clamp(90px, 13vh, 150px) * -1); background: linear-gradient(180deg, rgba(226, 85, 75, .55), rgba(156, 54, 49, 0) 85%); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.02em; user-select: none; pointer-events: none; }

/* ---------- tiles ---------- */

.brands span { font-family: var(--display); font-size: clamp(1.6rem, 3.2vw, 2.8rem); color: rgba(246, 238, 234, .55); transition: color .4s, transform .7s var(--spring), text-shadow .4s; }
.brands span:hover { color: var(--white); transform: translateY(-6px) scale(1.06); text-shadow: 0 0 30px rgba(226, 85, 75, .8); }

/* ---------- responsive ---------- */

}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .2s !important; transition-delay: 0s !important; }

/* ==========================================================
   Reader / lightbox overlay
   ========================================================== */
.modal { position: fixed; inset: 0; z-index: 170; visibility: hidden; pointer-events: none; }
.modal.open { visibility: visible; pointer-events: auto; }
.modal.closing { visibility: visible; }
.m-bg { position: absolute; inset: 0; background: radial-gradient(ellipse at var(--cx, 50%) var(--cy, 50%), rgba(60, 20, 18, .96), rgba(10, 6, 6, .97) 60%); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); clip-path: circle(0 at var(--cx, 50%) var(--cy, 50%)); transition: clip-path .9s var(--ease-io); }
.modal.open .m-bg { clip-path: circle(150vmax at var(--cx, 50%) var(--cy, 50%)); }
.m-scroll { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; opacity: 0; transform: translateY(60px); transition: opacity .45s var(--ease-out), transform .9s var(--spring); outline: none; }
.modal.open .m-scroll { opacity: 1; transform: none; transition-delay: .28s; }
.m-close { position: absolute; top: 20px; right: var(--gutter); z-index: 3; --h: 46px; font-size: 11px; opacity: 0; transform: translateY(-20px); transition: opacity .4s, transform .8s var(--spring), border-color .4s; }

.m-body { max-width: 780px; margin: 0 auto; padding: clamp(100px, 14vh, 150px) var(--gutter) 140px; }
.m-body > * { animation: mIn 1s var(--spring) both; animation-delay: calc(var(--i, 0) * 70ms + 320ms); }
@keyframes mIn { from { opacity: 0; transform: translateY(40px); filter: blur(8px); } }
.m-title { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 4.4vw, 3.8rem); line-height: 1.06; margin-bottom: 20px; }
.m-body .kicker::before { transform: scaleX(1); }
.m-meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--steel); margin-bottom: 40px; display: flex; gap: 18px; flex-wrap: wrap; }
.prose { color: rgba(246, 238, 234, .84); font-size: clamp(1.02rem, 1.2vw, 1.12rem); line-height: 1.85; }
.prose p { margin: 0 0 1.15em; }
.prose h3, .prose h4 { font-family: var(--display); font-weight: 400; color: var(--white); line-height: 1.2; margin: 1.9em 0 .55em; }
.prose h3 { font-size: clamp(1.5rem, 2.4vw, 2rem); }
.prose h4 { font-size: clamp(1.2rem, 1.8vw, 1.5rem); color: var(--spark); }
.prose h3 strong, .prose h4 strong { font-weight: 400; }
.prose strong { color: var(--white); font-weight: 500; }
.prose ul, .prose ol { padding-left: 1.3em; margin: 0 0 1.3em; }
.prose li { margin: .45em 0; padding-left: .3em; }

.m-img { width: 100%; border-radius: 18px; border: 1px solid var(--line); margin: 6px 0 18px; }
.m-img.portrait { width: min(320px, 70%); aspect-ratio: 4 / 5; object-fit: cover; border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%; animation: morph 9s ease-in-out infinite; box-shadow: 0 30px 80px -30px rgba(226, 85, 75, .9); }
.m-cta { margin-top: 40px; display: flex; gap: 14px; flex-wrap: wrap; }
/* photo mode */

.m-photo { margin: 0; display: grid; justify-items: center; gap: 18px; }
.m-photo img { max-width: min(92vw, 1100px); max-height: 76vh; width: auto; height: auto; border-radius: 18px; box-shadow: 0 40px 120px -30px rgba(0, 0, 0, .9), 0 0 0 1px var(--line); }

.m-nav { position: absolute; top: 50%; z-index: 3; width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(13, 9, 9, .6); backdrop-filter: blur(10px); display: none; place-items: center; color: var(--white); transition: transform .7s var(--spring), background .3s; cursor: pointer; }

/* read tags and "more" buttons */

button.more:hover .arr { transform: translateX(4px) rotate(-45deg); }

/* project strip */
.strip { grid-column: 1 / -1; margin: 40px calc(var(--gutter) * -1) 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: grab; padding: 10px var(--gutter) 30px; -webkit-mask: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); mask: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent); }

.shot { position: relative; margin: 0; width: clamp(220px, 23vw, 330px); aspect-ratio: 400 / 516; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); flex: none; background: #1a0f0f; transform: skewX(calc(var(--sk, 0) * 1deg)); transition: transform .7s var(--spring), border-color .4s, box-shadow .5s; }
.shot img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.08) translateX(var(--px, 0px)); filter: grayscale(.55) brightness(.78) contrast(1.05); transition: filter .6s, transform 1s var(--spring); pointer-events: none; user-select: none; -webkit-user-drag: none; }
.shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(13, 9, 9, .85)); pointer-events: none; }
.shot figcaption { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--white); line-height: 1.5; }
.shot:hover { border-color: var(--ember); box-shadow: 0 30px 60px -20px rgba(226, 85, 75, .55); }
.shot:hover img { filter: none; transform: scale(1.16) translateX(var(--px, 0px)); }

/* photo blobs, logos */
.blob.photo { padding: 0; overflow: hidden; width: 96px; height: 96px; }
.blob.photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.25) contrast(1.05); transition: filter .5s, transform .8s var(--spring); }
.person:hover .blob.photo img { filter: none; transform: scale(1.08); }
.blob.lg { width: clamp(130px, 14vw, 170px); height: clamp(130px, 14vw, 170px); }
.logos { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 40px; }
.logo-tile { display: grid; place-items: center; background: #f6eeea; border-radius: 18px; padding: 16px 26px; height: 100px; min-width: 200px; filter: grayscale(1) contrast(1.05); opacity: .85; transition: filter .5s, opacity .4s, transform .8s var(--spring), box-shadow .5s; box-shadow: 0 20px 50px -25px rgba(0, 0, 0, .8); }
.logo-tile:hover { filter: none; opacity: 1; transform: translateY(-8px) rotate(-1.5deg); box-shadow: 0 30px 60px -20px rgba(226, 85, 75, .6); }
.logo-tile img { max-height: 64px; max-width: 190px; object-fit: contain; }

.logo-tile.sm img { max-height: 40px; max-width: 150px; }
.card.product:hover .logo-tile { filter: none; opacity: 1; }

@media (max-width: 1200px) { .links a { padding: 10px 12px; letter-spacing: .1em; } }
@media (max-width: 560px) { .logo-tile { min-width: 0; width: 100%; } }

/* ==========================================================
   Motion glyphs (where the live site had icon images)
   ========================================================== */
.svc-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; margin-top: 44px; }
.svc { position: relative; display: flex; flex-direction: column; gap: 14px; min-height: 196px; padding: 22px 22px 20px; text-align: left; }
.svc .n { position: absolute; top: 18px; right: 20px; font-family: var(--mono); font-size: 11px; color: var(--steel); }
.svc .h3 { font-size: clamp(1.05rem, 1.25vw, 1.25rem); line-height: 1.25; margin-top: auto; }
.svc .read-tag { align-self: flex-start; }
.glyph { display: block; width: 78px; height: 78px; color: rgba(246, 238, 234, .85); transition: transform .9s var(--spring), filter .5s, color .4s; transform-origin: left bottom; }
.card:hover .glyph { transform: scale(1.18) rotate(-3deg); color: var(--white); filter: drop-shadow(0 0 10px rgba(226, 85, 75, .75)); }
.tile .glyph { margin-bottom: 18px; }
.gl { width: 100%; height: 100%; overflow: visible; }
.gl * { transform-box: view-box; }
.gl .s { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.gl .as { stroke: var(--ember); }
.gl .a { fill: var(--ember); }
.gl .sp { fill: var(--spark); }
.k-spin { animation: gSpin var(--t, 6s) linear infinite; }
.k-sweep { animation: gSweep var(--t, 2.4s) ease-in-out infinite alternate; }
.k-blink { animation: gBlink var(--t, 1.6s) ease-in-out var(--d, 0s) infinite; }
.k-pulse { transform-box: fill-box !important; transform-origin: center; animation: gPulse var(--t, 1.8s) ease-in-out var(--d, 0s) infinite; }
.k-flow { stroke-dasharray: 3 5; animation: gFlow var(--t, 1s) linear infinite; }
.k-draw { stroke-dasharray: var(--l); stroke-dashoffset: var(--l); animation: gDraw var(--t, 3.6s) ease-in-out var(--d, 0s) infinite; }
.k-move { animation: gMove var(--t, 1.6s) ease-in-out var(--d, 0s) infinite alternate; }
.k-slide { animation: gSlide var(--t, 1.6s) linear infinite; }
.k-grow { transform-box: fill-box !important; transform-origin: bottom; animation: gGrow var(--t, 1.4s) ease-in-out var(--d, 0s) infinite alternate; }
.k-wave { transform-box: fill-box !important; transform-origin: center; animation: gWave var(--t, 1.8s) ease-out var(--d, 0s) infinite; }
.k-path { offset-rotate: 0deg; animation: gPath var(--t, 3s) linear infinite; }
.k-type { transform-box: fill-box !important; transform-origin: left; animation: gType var(--t, 2.4s) steps(8) var(--d, 0s) infinite; }
.k-track { animation: gTrack var(--t, 4s) ease-in-out infinite; }
.k-rise { transform-box: fill-box !important; transform-origin: center; animation: gRise var(--t, 2.4s) ease-out var(--d, 0s) infinite; }
.k-flip { animation: gFlip var(--t, 3.2s) ease-in-out infinite; }
.k-arc { animation: gArc var(--t, 1.6s) ease-in-out var(--d, 0s) infinite; }
.k-glow { animation: gGlow 2.6s ease-in-out infinite; }
@keyframes gSpin { to { transform: rotate(360deg); } }
@keyframes gSweep { from { transform: rotate(var(--a0, -50deg)); } to { transform: rotate(var(--a1, 50deg)); } }
@keyframes gBlink { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }
@keyframes gPulse { 0%, 100% { transform: scale(.82); opacity: .7; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes gFlow { to { stroke-dashoffset: -16; } }
@keyframes gDraw { 0% { stroke-dashoffset: var(--l); } 45%, 70% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: calc(var(--l) * -1); } }
/* travel distances must not inherit: a part riding on a moving carriage only moves on its own axis */
@property --dx { syntax: '<length>'; inherits: false; initial-value: 0px; }
@property --dy { syntax: '<length>'; inherits: false; initial-value: 0px; }
@keyframes gMove { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 0px), var(--dy, 0px)); } }
@keyframes gSlide { from { transform: translateX(0); } to { transform: translateX(var(--dx, 20px)); } }
@keyframes gGrow { from { transform: scaleY(.25); } to { transform: scaleY(1); } }
@keyframes gWave { 0% { transform: scale(.4); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
@keyframes gPath { from { offset-distance: 0%; } to { offset-distance: 100%; } }
@keyframes gType { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes gTrack { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(12px, -9px); } 50% { transform: translate(5px, 11px); } 75% { transform: translate(-12px, 3px); } }
@keyframes gRise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-16px) scale(1.5); opacity: 0; } }
@keyframes gFlip { 0%, 15% { transform: scaleX(1); } 50% { transform: scaleX(0); } 85%, 100% { transform: scaleX(-1); } }
@keyframes gArc { 0%, 100% { opacity: .12; } 40% { opacity: 1; } }
@keyframes gGlow { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.k-mer { transform-origin: 100px 100px; animation: gMer 4s linear var(--d, 0s) infinite; }
@keyframes gMer { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .gl * { animation: none !important; } }

/* projects as motion scenes */
.proj-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 48px; }
.proj { padding: 26px; display: flex; flex-direction: column; gap: 14px; }
.proj .scene { display: block; width: 100%; aspect-ratio: 16 / 10; color: rgba(246, 238, 234, .85); border-radius: 14px; background: radial-gradient(ellipse at 50% 80%, rgba(156, 54, 49, .18), transparent 70%), linear-gradient(rgba(226, 85, 75, .07) 1px, transparent 1px) 0 0 / 20px 20px, linear-gradient(90deg, rgba(226, 85, 75, .07) 1px, transparent 1px) 0 0 / 20px 20px; padding: 14px; transition: transform .9s var(--spring), filter .5s; }
.proj:hover .scene { transform: scale(1.04); filter: drop-shadow(0 0 14px rgba(226, 85, 75, .6)); }
.proj .h3 { font-size: clamp(1.15rem, 1.5vw, 1.4rem); }
@media (max-width: 860px) { .proj-grid { grid-template-columns: 1fr; } }

/* clients as moving wordmarks */
.clients { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; margin-top: 40px; }
.client { position: relative; overflow: hidden; display: grid; gap: 6px; justify-items: center; padding: 22px 34px; min-width: 220px; border-radius: 18px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); transition: transform .8s var(--spring), border-color .4s, box-shadow .5s; }
.client b { font-family: var(--display); font-weight: 400; font-size: clamp(1.8rem, 3vw, 2.6rem); line-height: 1; background: linear-gradient(100deg, var(--white) 0 40%, var(--spark) 48%, #fff 50%, var(--spark) 52%, var(--white) 60% 100%); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: sheen 4s ease-in-out infinite; animation-delay: var(--sd, 0s); }
.client small { font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--steel); }
.client::after { content: ""; position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 10px var(--ember); top: 10px; left: 10px; offset-path: inset(4px round 14px); animation: orbit 6s linear infinite; animation-delay: var(--sd, 0s); }
.client:hover { transform: translateY(-8px) rotate(-1.5deg); border-color: var(--ember); box-shadow: 0 30px 60px -20px rgba(226, 85, 75, .6); }
@keyframes sheen { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }
@keyframes orbit { to { offset-distance: 100%; } }

/* products: motion mark instead of logo */
.product .glyph { margin-bottom: 18px; }

/* bios: big morphing initials instead of photos */
.person[data-open] { cursor: pointer; }
.person .more { margin-top: 18px; display: inline-flex; gap: 10px; align-items: center; font-family: var(--mono); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--spark); }
.m-avatar { position: relative; width: 190px; height: 190px; margin: 6px 0 34px; display: grid; place-items: center; }
.m-avatar::before, .m-avatar::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 1px dashed rgba(255, 176, 143, .5); animation: gSpin 14s linear infinite; }
.m-avatar::after { inset: -28px; border: 1px solid rgba(226, 85, 75, .25); border-top-color: var(--ember); animation-duration: 3.2s; }
.blob.xl { width: 190px; height: 190px; font-size: 3.4rem; margin: 0; box-shadow: 0 30px 90px -20px rgba(226, 85, 75, .9), inset 0 -14px 30px rgba(0, 0, 0, .25); }
.m-globe { width: min(320px, 80%); margin: 6px auto 30px; color: rgba(246, 238, 234, .85); }
.m-contact { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }

/* ==========================================================
   Calmer background (feedback: too busy)
   ========================================================== */
.fx-beams i { animation: none; opacity: .35; transform: rotate(24deg); }
.fx-grain { animation: none; opacity: .045; }

/* card animations play when the card arrives (.live, a few seconds) or on hover/focus, otherwise rest */
.glyph .gl *, .scene .gl * { animation-play-state: paused; }
.live .gl *, .card:hover .gl *, .card:focus-visible .gl *, .m-globe .gl * { animation-play-state: running; }

/* isometric building: what each system does */
.iso-detail { grid-column: 1 / -1; margin-top: 18px; padding: 18px 22px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass); min-height: 96px; display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: baseline; }

// Particle engine: one continuous field of sparks that springs

async function initParticles(canvas, logo, opts) {
  const THREE = await import('three');
  const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
  const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
  const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');

  const reduce = opts.reduce;
  const small = Math.min(innerWidth, innerHeight) < 700 || innerWidth < 860;
  const N = small ? 9000 : 22000;
  const R = Math.random, TAU = Math.PI * 2;

  // ---------- renderer ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  const DPR = Math.min(devicePixelRatio || 1, small ? 1.5 : 1.6);
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight, false);
  renderer.setClearColor(0x000000, 1); // canvas is screen-blended over the ink page background
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 0, 10);
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), small ? 0.5 : 0.62, 0.42, 0.22);
  composer.addPass(bloom);

  // ---------- buffers ----------
  const P = new Float32Array(N * 3), V = new Float32Array(N * 3);
  const Br = new Float32Array(N), Heat = new Float32Array(N), Size = new Float32Array(N);
  const K = new Float32Array(N), Sd = new Float32Array(N), Rd = new Float32Array(N), SW = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const d = randDir(), r = Math.cbrt(R()) * 0.3;
    P[i * 3] = d[0] * r; P[i * 3 + 1] = d[1] * r; P[i * 3 + 2] = d[2] * r;
    Heat[i] = Math.pow(R(), 2.2);
    Size[i] = R() < 0.03 ? 2.2 + R() * 1.4 : 0.55 + R() * 0.95;
    K[i] = 0.018 + R() * 0.03;            // per-particle stiffness: some lag, some lead
    Sd[i] = R() * TAU; Rd[i] = R();
    Br[i] = 1;
  }
  const geo = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(P, 3).setUsage(THREE.DynamicDrawUsage);
  const brAttr = new THREE.BufferAttribute(Br, 1).setUsage(THREE.DynamicDrawUsage);
  geo.setAttribute('position', posAttr);
  geo.setAttribute('aBright', brAttr);
  geo.setAttribute('aHeat', new THREE.BufferAttribute(Heat, 1));
  geo.setAttribute('aSize', new THREE.BufferAttribute(Size, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 100);

  const css = getComputedStyle(document.documentElement);
  const col = n => new THREE.Color(css.getPropertyValue(n).trim());
  const mat = new THREE.ShaderMaterial({

// ---------------------------------------------------------------- loader
// The logo "charges up" with the counter: glow, electric edge, sparks and a shake that build to 100%,
// then it shatters (see boot) and the particle field explodes out of it.
const loaderEl = $('#loader'), ldCount = $('.ld-count'), ldBar = $('.ld-bar i'), ldWrap = $('.ld-logo-wrap');
let ldTarget = 0.15, ldVal = 0, ldDone = false;
function ldSpark() {
  const r = ldWrap.getBoundingClientRect(); if (!r.width) return;
  const side = Math.random() * 4 | 0, u = Math.random();
  const x = side < 2 ? r.left + u * r.width : (side === 2 ? r.left : r.right), y = side < 2 ? (side ? r.bottom : r.top) : r.top + u * r.height;
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, a = Math.atan2(y - cy, x - cx) + (Math.random() - 0.5) * 0.9, d = 30 + Math.random() * 90 * (0.4 + ldVal);
  const s = document.createElement('i'); s.className = 'ld-spark'; s.style.left = x + 'px'; s.style.top = y + 'px';
  loaderEl.append(s);
  s.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d}px)) scale(.2)`, opacity: 0 }],
    { duration: 380 + Math.random() * 420, easing: 'cubic-bezier(.1,.8,.3,1)' }).finished.then(() => s.remove());
}
(function ldTick() {
  ldVal += (ldTarget - ldVal) * 0.06;
  if (ldTarget === 1 && ldVal > 0.993) ldVal = 1;
  ldCount.textContent = String(Math.round(ldVal * 100)).padStart(3, '0');
  ldBar.style.setProperty('--p', ldVal.toFixed(3));
  ldWrap.style.setProperty('--p', ldVal.toFixed(3));
  if (!reduce) {
    const amp = Math.pow(ldVal, 3) * 3.5;
    ldWrap.style.transform = `translate(${((Math.random() - 0.5) * amp).toFixed(2)}px, ${((Math.random() - 0.5) * amp).toFixed(2)}px)`;
    if (ldVal > 0.2 && Math.random() < ldVal * 0.55) ldSpark();
  }
  if (!ldDone) requestAnimationFrame(ldTick);
})();

// ---------------------------------------------------------------- logo → alpha mask
function processLogo() {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const w = img.naturalWidth, h = img.naturalHeight, c = document.createElement('canvas');
      c.width = w; c.height = h;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(img, 0, 0);
      const id = x.getImageData(0, 0, w, h), d = id.data, alpha = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        const m = Math.min(d[i], d[i + 1], d[i + 2]);       // red bg has a low min channel, white letters a high one
        alpha[p] = clamp((m - 90) / 130, 0, 1) * 255;
      }
      res({ w, h, alpha });
    };
    img.onerror = () => res({ w: 1, h: 1, alpha: new Uint8Array(1) });
    img.src = LOGO_SRC;
  });
}

// ---------------------------------------------------------------- shutter transition
const shutter = $('#shutter'), shCols = $$('#shutter .col'), shTitle = $('#shutter .sh-title');
const EIO = 'cubic-bezier(.76,0,.24,1)';
function shutterIn(name) {
  shutter.classList.add('on');
  $('.sh-n', shTitle).textContent = name;
  const dur = reduce ? 1 : 620;
  const done = shCols.map((c, i) => {
    const b = c.firstElementChild;
    c.style.transformOrigin = 'bottom'; b.style.transformOrigin = 'bottom';
    c.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: dur, delay: reduce ? 0 : i * 55, easing: EIO, fill: 'forwards' });
    return b.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: dur, delay: reduce ? 0 : 160 + i * 55, easing: EIO, fill: 'forwards' }).finished;
  });
  shTitle.animate([{ opacity: 0, transform: 'translateY(50px) scale(.96)', filter: 'blur(10px)' }, { opacity: 1, transform: 'none', filter: 'blur(0)' }], { duration: reduce ? 1 : 700, delay: reduce ? 0 : 420, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' });

}
function shutterOut() {
  const dur = reduce ? 1 : 700;
  shTitle.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-40px)', filter: 'blur(8px)' }], { duration: reduce ? 1 : 380, easing: EIO, fill: 'forwards' });
  const done = shCols.map((c, i) => {
    const b = c.firstElementChild;

    b.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(0)' }], { duration: dur, delay: reduce ? 0 : 120 + i * 50, easing: EIO, fill: 'forwards' });
    return c.animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(0)' }], { duration: dur, delay: reduce ? 0 : 260 + i * 50, easing: EIO, fill: 'forwards' }).finished;
  });
  return Promise.all(done).then(() => {
    shutter.classList.remove('on');
    shCols.forEach(c => { c.getAnimations().forEach(a => a.cancel()); c.firstElementChild.getAnimations().forEach(a => a.cancel()); });
    shTitle.getAnimations().forEach(a => a.cancel());
  });
}
