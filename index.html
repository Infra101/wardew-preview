function splitWords(el) {
  let i = 0;
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) {
        const frag = document.createDocumentFragment();
        n.textContent.split(/(\s+)/).forEach(part => {
          if (!part) return;
          if (/^\s+$/.test(part)) { frag.append(' '); return; }
          const w = document.createElement('span'), wi = document.createElement('span');
          w.className = 'w'; wi.className = 'wi'; wi.textContent = part; wi.style.setProperty('--i', i++);
          w.append(wi); frag.append(w);
        });
        n.replaceWith(frag);
      } else if (n.nodeType === 1 && !n.classList.contains('neon')) walk(n);
    });
  };
  walk(el);
}

function onIn(el) {
  if (el.hasAttribute('data-scramble') && !reduce) setTimeout(() => scramble(el), root.classList.contains('loading') ? 1500 : 0);
  if (el.hasAttribute('data-board')) runBoard(el);
  // card animations run for a few seconds as they arrive, then rest until hovered
  if (el.hasAttribute('data-stagger')) [...el.children].forEach((c, i) => {
    if (!c.querySelector('.gl')) return;
    c.classList.add('live');
    setTimeout(() => c.classList.remove('live'), (root.classList.contains('loading') ? 5500 : 4000) + i * 70);
  });
}

// text scramble for kickers
const SCRAMBLE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=/<>';
function scramble(el) {
  const final = el.textContent, len = final.length, t0 = performance.now(), dur = 900;
  (function step(now) {
    const p = clamp((now - t0) / dur, 0, 1);
    let out = '';
    for (let i = 0; i < len; i++) {
      const ch = final[i];
      out += ch === ' ' || i / len < p ? ch : SCRAMBLE[(Math.random() * SCRAMBLE.length) | 0];
    }
    el.textContent = out;
    if (p < 1) requestAnimationFrame(step); else el.textContent = final;
  })(t0);
}

// ---------------------------------------------------------------- split-flap board
const FLAP = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789+/-';
function buildFlap(el) {
  const text = el.dataset.flap, len = Math.max(text.length, el.classList.contains('hot') ? 7 : text.length);
  el.setAttribute('aria-label', text);
  el.innerHTML = '';
  for (let i = 0; i < len; i++) { const c = document.createElement('span'); c.className = 'cell'; c.innerHTML = '<span> </span>'; c.dataset.ch = text[i] || ' '; el.append(c); }
}
function runBoard(board) {
  $$('.cell', board).forEach((cell, idx) => {
    const target = cell.dataset.ch, span = cell.firstElementChild;
    if (reduce) { span.textContent = target; return; }
    let flips = target === ' ' ? 0 : 6 + ((Math.random() * 10) | 0);
    const flipOnce = () => {
      const ch = flips <= 0 ? target : FLAP[(Math.random() * FLAP.length) | 0];
      span.animate([{ transform: 'rotateX(0)' }, { transform: 'rotateX(-90deg)', filter: 'brightness(.5)' }], { duration: 55, easing: 'ease-in' }).finished.then(() => {
        span.textContent = ch;
        span.animate([{ transform: 'rotateX(90deg)', filter: 'brightness(1.6)' }, { transform: 'rotateX(0)' }], { duration: 70, easing: 'cubic-bezier(.34,1.56,.64,1)' });
        if (flips-- > 0) setTimeout(flipOnce, 25);
      });
    };
    setTimeout(flipOnce, idx * 22 + Math.random() * 120);
  });
}

// ---------------------------------------------------------------- blueprint gears
function gearPath(p) {
  const [cx, cy, R, r, teeth] = p.dataset.gear.split(',').map(Number);
  const pts = [], steps = teeth * 4;
  for (let i = 0; i < steps; i++) {
    const a0 = (i / steps) * Math.PI * 2, a1 = ((i + 1) / steps) * Math.PI * 2, rad = (i % 4 === 0 || i % 4 === 1) ? R : r;
    pts.push(`${(cx + Math.cos(a0) * rad).toFixed(1)},${(cy + Math.sin(a0) * rad).toFixed(1)}`, `${(cx + Math.cos(a1) * rad).toFixed(1)},${(cy + Math.sin(a1) * rad).toFixed(1)}`);
  }
  p.setAttribute('d', 'M' + pts.join('L') + 'Z');
}

// ---------------------------------------------------------------- isometric building
function setupIso(wrap) {
  // Pointing at (or tapping) a system lights its block and shows what it does.
  // When nobody is pointing, it slowly steps through the systems on its own.
  const blks = $$('.blk', wrap), items = $$('.iso-list li', wrap), detail = $('.iso-detail', wrap);
  let manual = false, cur = -1, auto = 0;
  function select(i) {
    if (i === cur) return; cur = i;
    blks.forEach((b, k) => { b.classList.toggle('lit', k === i); b.classList.toggle('hl', k === i); });
    items.forEach((li, k) => li.classList.toggle('hl', k === i));
    const li = items[i];
    detail.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><b>${li.lastChild.textContent}</b><p>${li.dataset.desc}</p>`;
    detail.classList.remove('swap'); void detail.offsetWidth; detail.classList.add('swap');
  }
  items.forEach((li, i) => {
    li.tabIndex = 0;
    li.addEventListener('pointerenter', () => { manual = true; select(i); });
    li.addEventListener('click', () => { manual = true; select(i); });
    li.addEventListener('focus', () => { manual = true; select(i); });
  });
  blks.forEach((b, i) => b.addEventListener('pointerenter', () => { manual = true; select(i); }));
  wrap.addEventListener('pointerleave', () => { manual = false; });
  select(0);
  isoTimers.push(setInterval(() => {
    if (manual || !wrap.classList.contains('in')) return;
    auto = (cur + 1) % blks.length; select(auto);
  }, 3200));
}

// ---------------------------------------------------------------- ASCII field
function setupAscii(wrap) {
  const c = $('canvas', wrap), ctx = c.getContext('2d');
  const RAMP = ' .:-=+*#%@';
  const st = { c, ctx, wrap, cols: 0, rows: 0, cw: 10, ch: 16, mx: -1e3, my: -1e3 };
  const size = () => {
    const r = wrap.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = r.width * dpr; c.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    st.cw = r.width < 600 ? 8 : 10; st.ch = st.cw * 1.6;
    st.cols = Math.ceil(r.width / st.cw); st.rows = Math.ceil(r.height / st.ch);
    ctx.font = `${st.cw * 1.25}px "IBM Plex Mono", monospace`; ctx.textBaseline = 'top';
  };
  size(); st.size = size;
  wrap.addEventListener('pointermove', e => { const r = wrap.getBoundingClientRect(); st.mx = e.clientX - r.left; st.my = e.clientY - r.top; });
  wrap.addEventListener('pointerleave', () => { st.mx = st.my = -1e3; });
  st.draw = t => {
    const { ctx, cols, rows, cw, ch } = st;
    ctx.clearRect(0, 0, c.width, c.height);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const px = x * cw, py = y * ch;
      let v = Math.sin(x * 0.12 + t * 0.9) * 0.35 + Math.sin(y * 0.22 - t * 0.7 + x * 0.05) * 0.35 + Math.sin((x + y) * 0.07 + t * 0.5) * 0.3;
      const dx = px - st.mx, dy = py - st.my, d = Math.sqrt(dx * dx + dy * dy);
      v += Math.max(0, 1 - d / 170) * (1.2 + Math.sin(d * 0.08 - t * 6) * 0.6);
      v = clamp((v + 0.6) / 2, 0, 1);
      const k = (v * (RAMP.length - 1)) | 0;
      if (k === 0) continue;
      ctx.fillStyle = v > 0.82 ? 'rgba(255,214,196,.95)' : v > 0.6 ? 'rgba(226,85,75,.85)' : `rgba(156,54,49,${(0.25 + v * 0.6).toFixed(2)})`;
      ctx.fillText(RAMP[k], px, py);
    }
  };
  asciis.push(st);
}

// ---------------------------------------------------------------- micro-interactions
function magnetic(el) {
  if (!fine || reduce) return;
  el.addEventListener('pointermove', e => {
    const r = el.getBoundingClientRect(), x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2);
    el.style.transition = 'transform .15s linear, border-color .4s, box-shadow .5s';
    el.style.transform = `translate(${x * 0.3}px, ${y * 0.4}px)`;
  });
  el.addEventListener('pointerleave', () => { el.style.transition = ''; el.style.transform = ''; });
}
function btnFill(el) {
  el.addEventListener('pointerenter', e => { const r = el.getBoundingClientRect(); el.style.setProperty('--x', e.clientX - r.left + 'px'); el.style.setProperty('--y', e.clientY - r.top + 'px'); });
  el.addEventListener('pointerleave', e => { const r = el.getBoundingClientRect(); el.style.setProperty('--x', e.clientX - r.left + 'px'); el.style.setProperty('--y', e.clientY - r.top + 'px'); });
}
function tilt(el) {
  el.addEventListener('pointermove', e => {
    const r = el.getBoundingClientRect(), u = (e.clientX - r.left) / r.width, v = (e.clientY - r.top) / r.height;
    el.style.setProperty('--mx', u * 100 + '%'); el.style.setProperty('--my', v * 100 + '%');
    if (!fine || reduce) return;
    el.classList.add('tilting');
    el.style.setProperty('--rx', ((0.5 - v) * 10).toFixed(2) + 'deg'); el.style.setProperty('--ry', ((u - 0.5) * 12).toFixed(2) + 'deg');
  });
  el.addEventListener('pointerleave', () => { el.classList.remove('tilting'); el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); });
}

// ---------------------------------------------------------------- form
function setupForm(form) {
  form.addEventListener('submit', e => {
    e.preventDefault();
    let ok = true;
    $$('[required]', form).forEach(f => {
      const field = f.closest('.field'), bad = !f.value.trim() || (f.type === 'email' && !/^\S+@\S+\.\S+$/.test(f.value));
      field.classList.remove('bad'); void field.offsetWidth;
      if (bad) { field.classList.add('bad'); ok = false; }
    });
    if (!ok) { gl && gl.burst(0.4); return; }
    const btn = $('button[type=submit] .btn-t', form); btn.textContent = 'Sending…';
    setTimeout(() => {
      form.style.display = 'none';
      $('#form-ok').classList.add('show');
      holdShape = true; gl && (gl.burst(0.8), gl.setShape('check', 'right', 0));
      setTimeout(() => { holdShape = false; activeIdx = -1; }, 5000);
      measure();
    }, 700);
  });
}

// ---------------------------------------------------------------- cursor + pointer
const cRing = $('.c-ring'), cDot = $('.c-dot'), cLbl = $('.c-ring span');
addEventListener('pointermove', e => {
  ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved = true;
  gl && gl.pointer(e.clientX, e.clientY);
}, { passive: true });
document.addEventListener('pointerleave', () => gl && gl.pointerOut());
addEventListener('blur', () => gl && gl.pointerOut());
document.addEventListener('pointerover', e => {
  if (!fine) return;
  const t = e.target.closest('a, button, [data-cursor], input, textarea, label, .chip, .row, .card');
  cRing.classList.remove('hover', 'label', 'text'); cLbl.textContent = '';
  if (!t) return;
  if (t.matches('input:not([type=radio]), textarea')) cRing.classList.add('text');
  else if (t.dataset.cursor) { cRing.classList.add('label'); cLbl.textContent = t.dataset.cursor; }
  else cRing.classList.add('hover');
});
addEventListener('pointerdown', e => {
  cRing.classList.add('down');
  if (reduce) return;
  const r = document.createElement('span'); r.className = 'ripple'; r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
  document.body.append(r); setTimeout(() => r.remove(), 950);
  gl && gl.shock(e.clientX, e.clientY, 1);
});
addEventListener('pointerup', () => cRing.classList.remove('down'));

// keyboard focus: the smooth scroller is position:fixed, so the browser can't scroll focused
// elements into view on its own. Do it for it.
document.addEventListener('focusin', e => {
  if (!smooth || !view.contains(e.target)) return;
  const r = e.target.getBoundingClientRect();
  if (r.top < 90 || r.bottom > innerHeight - 60) window.scrollTo(0, Math.max(0, scroll.cur + r.top - innerHeight * 0.4));
});

// ---------------------------------------------------------------- measure & resize
const hudIdx = $('.h-idx'), hudLbl = $('.h-lbl'), prog = $('.progress');
function measure() {
  sections = $$('.sec', view).map(el => ({ el, top: el.offsetTop, h: el.offsetHeight, shape: el.dataset.shape || 'scatter', side: el.dataset.side || 'center', y: +el.dataset.y || 0, dim: el.classList.contains('foot'), label: el.dataset.label || '' }));
  if (smooth) document.body.style.height = scroller.offsetHeight + 'px';
  $$('b', prog).forEach(b => b.remove());
  const total = Math.max(1, scroller.offsetHeight - innerHeight);
  sections.forEach(s => { const b = document.createElement('b'); b.style.top = clamp(s.top / total, 0, 1) * 100 + '%'; prog.append(b); });
  marquees.forEach(m => (m.w = m.tr.scrollWidth / 2));
  asciis.forEach(a => a.size());
}
new ResizeObserver(() => measure()).observe(scroller);
addEventListener('resize', () => { measure(); placePill(); });

function updateActive() {
  if (!sections.length) return;
  const c = scroll.cur + innerHeight * 0.5;
  let idx = sections.findIndex(s => c >= s.top && c < s.top + s.h);
  if (idx < 0) idx = c < sections[0].top ? 0 : (activeIdx < 0 ? sections.length - 1 : activeIdx);
  if (idx === activeIdx) return;
  activeIdx = idx;
  const s = sections[idx];
  gl && gl.setShape(s.shape, s.side, s.y, { dim: s.dim });
  hudIdx.textContent = String(idx + 1).padStart(2, '0');
  hudLbl.textContent = s.label;
  [hudIdx, hudLbl].forEach(n => { n.classList.remove('swap'); void n.offsetWidth; n.classList.add('swap'); });
  $$('b', prog).forEach((b, i) => b.classList.toggle('on', i === idx));
}

// ---------------------------------------------------------------- main loop
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const f = dt * 60;
  scroll.target = window.scrollY;
  const prevCur = scroll.cur;
  scroll.cur = smooth ? scroll.cur + (scroll.target - scroll.cur) * (1 - Math.pow(1 - 0.09, f)) : scroll.target;
  if (Math.abs(scroll.target - scroll.cur) < 0.05) scroll.cur = scroll.target;
  scroll.vel = (scroll.cur - prevCur) / Math.max(f, 0.001);
  scroll.velS += (scroll.vel - scroll.velS) * 0.12;
  if (smooth) scroller.style.transform = `translate3d(0, ${-scroll.cur.toFixed(2)}px, 0)`;
  root.style.setProperty('--vel', clamp(scroll.velS, -40, 40).toFixed(2));

  // nav show / hide
  if (scroll.cur > 120) nav.classList.add('solid'); else nav.classList.remove('solid');
  if (scroll.velS > 2.2 && scroll.cur > 300 && !root.classList.contains('menu-open')) nav.classList.add('hide');
  else if (scroll.velS < -1.5 || scroll.cur < 300) nav.classList.remove('hide');

  const total = Math.max(1, scroller.offsetHeight - innerHeight);
  prog.style.setProperty('--p', clamp(scroll.cur / total, 0, 1).toFixed(4));
  if (!holdShape) updateActive();

  // marquees: speed and skew react to scroll velocity
  const skew = clamp(scroll.velS * -0.35, -12, 12);
  marquees.forEach(m => {
    if (!m.w) m.w = m.tr.scrollWidth / 2;
    m.x -= (0.7 + Math.abs(scroll.velS) * 0.45) * m.dir * f;
    if (m.x <= -m.w) m.x += m.w; if (m.x > 0) m.x -= m.w;
    m.tr.style.transform = `translate3d(${m.x.toFixed(1)}px,0,0) skewX(${skew.toFixed(2)}deg)`;
  });
  // kinetic type: lines slide with section progress
  kinetics.forEach(k => {
    const s = sections.find(x => x.el === k.sec); if (!s) return;
    const p = (scroll.cur + innerHeight - s.top) / (s.h + innerHeight);
    k.el.style.transform = `translate3d(${((p - 0.5) * 40 * k.dir - 10).toFixed(2)}vw,0,0) skewX(${(skew * 0.6).toFixed(2)}deg)`;
  });
  timelines.forEach(t => { const r = t.getBoundingClientRect(); t.style.setProperty('--p', clamp((innerHeight * 0.75 - r.top) / r.height, 0, 1).toFixed(3)); });
  asciis.forEach(a => { const r = a.wrap.getBoundingClientRect(); if (r.bottom > 0 && r.top < innerHeight) a.draw(now / 1000); });

  // cursor
  if (fine) {
    ptr.rx += (ptr.x - ptr.rx) * (1 - Math.pow(1 - 0.18, f)); ptr.ry += (ptr.y - ptr.ry) * (1 - Math.pow(1 - 0.18, f));
    cDot.style.transform = `translate3d(${ptr.x}px,${ptr.y}px,0)`;
    cRing.style.transform = `translate3d(${ptr.rx.toFixed(1)}px,${ptr.ry.toFixed(1)}px,0)`;
  }

  gl && gl.frame(dt, scroll.velS);
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- boot
(async function boot() {
  const logoP = processLogo();
  const fontsP = document.fonts ? document.fonts.ready.catch(() => {}) : Promise.resolve();
  ldTarget = 0.35;
  const logo = await logoP;
  ldTarget = 0.55;
  try { gl = await initParticles($('#gl'), logo, { reduce }); if (/debug/.test(location.search)) window.__wd = gl; }
  catch (err) { console.warn('[wardew] particles unavailable, continuing without WebGL', err); root.classList.add('no-gl'); }
  ldTarget = 0.85;
  await Promise.race([fontsP, wait(2500)]);
  await wait(reduce ? 0 : 500);
  ldTarget = 1;

  mount(pageFromHash());
  holdShape = true;
  requestAnimationFrame(t => { last = t; requestAnimationFrame(tick); });
  gl && gl.setShape('core');
  const t0 = performance.now();
  while (ldVal < 1 && performance.now() - t0 < 3000) await wait(30);

  if (reduce) {
    ldDone = true;
    await loaderEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }).finished;
    root.classList.remove('loading'); loaderEl.remove();
  } else {
    // overload: the logo buzzes hard for a beat
    $('.ld-status').textContent = 'Ignition';
    for (let i = 0; i < 14; i++) ldSpark();
    await wait(420);
    ldDone = true;
    loaderEl.classList.add('critical');
    await wait(480);
    await explodeLoader();
  }
  holdShape = false; activeIdx = -1;
  placePill();
})();

// Shatter the logo into shards, flash, shockwave, and blow the particle core outwards.
async function explodeLoader() {
  const r = ldWrap.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cols = innerWidth < 600 ? 10 : 16, rows = innerWidth < 600 ? 6 : 9, w = r.width / cols, h = r.height / rows;
  const frag = document.createDocumentFragment(), shards = [];
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const s = document.createElement('i'); s.className = 'ld-shard';
    Object.assign(s.style, { left: r.left + x * w + 'px', top: r.top + y * h + 'px', width: w + 0.6 + 'px', height: h + 0.6 + 'px', backgroundImage: `url(${LOGO_SRC})`, backgroundSize: `${r.width}px ${r.height}px`, backgroundPosition: `${-x * w}px ${-y * h}px` });
    shards.push({ s, sx: r.left + (x + 0.5) * w, sy: r.top + (y + 0.5) * h }); frag.append(s);
  }
  loaderEl.append(frag);
  ldWrap.style.visibility = 'hidden';
  $('.ld-meta', loaderEl).style.opacity = 0; $('.ld-bar', loaderEl).style.opacity = 0;

  const flash = $('.ld-flash', loaderEl); flash.style.setProperty('--cx', cx + 'px'); flash.style.setProperty('--cy', cy + 'px');
  flash.animate([{ opacity: 0 }, { opacity: 1, offset: 0.12 }, { opacity: 0 }], { duration: 750, easing: 'ease-out' });
  [0, 140].forEach((delay, k) => {
    const wv = document.createElement('i'); wv.className = 'ld-wave'; wv.style.left = cx + 'px'; wv.style.top = cy + 'px'; loaderEl.append(wv);
    wv.animate([{ transform: 'translate(-50%,-50%) scale(0)', opacity: 1, borderWidth: '6px' }, { transform: `translate(-50%,-50%) scale(${Math.hypot(innerWidth, innerHeight) / (k ? 70 : 50)})`, opacity: 0, borderWidth: '.5px' }],
      { duration: 1200, delay, easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards' });
  });
  shards.forEach(({ s, sx, sy }) => {
    const dx = sx - cx, dy = sy - cy, d = Math.hypot(dx, dy) || 1, v = 260 + Math.random() * 720;
    const tx = (dx / d) * v + (Math.random() - 0.5) * 240, ty = (dy / d) * v * 0.8 + (Math.random() - 0.5) * 240 + 140;
    const ax = Math.random() - 0.5, ay = Math.random() - 0.5, deg = (Math.random() - 0.5) * 900;
    s.animate([
      { transform: 'translate3d(0,0,0) rotate3d(0,0,1,0deg) scale(1)', opacity: 1, filter: 'brightness(2.2)' },
      { transform: `translate3d(${tx * 0.25}px, ${ty * 0.25 - 40}px, 0) rotate3d(${ax},${ay},1,${deg * 0.3}deg) scale(1.05)`, opacity: 1, filter: 'brightness(1.4)', offset: 0.18 },
      { transform: `translate3d(${tx}px, ${ty}px, 0) rotate3d(${ax},${ay},1,${deg}deg) scale(${0.15 + Math.random() * 0.4})`, opacity: 0, filter: 'brightness(1)' },
    ], { duration: 1000 + Math.random() * 800, easing: 'cubic-bezier(.12,.75,.3,1)', fill: 'forwards' });
  });
  if (gl) { gl.burst(3.2); gl.setShape('scatter'); gl.shock(cx, cy, 2.2); }
  loaderEl.animate([{ backgroundColor: 'rgba(13,9,9,1)' }, { backgroundColor: 'rgba(13,9,9,0)' }], { duration: 900, delay: 60, easing: 'ease-out', fill: 'forwards' });
  await wait(700);
  root.classList.remove('loading');
  await wait(1100);
  loaderEl.remove();
}

</script>
